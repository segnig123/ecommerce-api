name: E-Commerce API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ecommerce_db
          POSTGRES_USER: ecommerce_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_user -d ecommerce_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        run: |
          echo "SECRET_KEY=ci-secret-key-for-checks" >> $GITHUB_ENV
          echo "DEBUG=True" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> $GITHUB_ENV
          echo "DB_NAME=ecommerce_db" >> $GITHUB_ENV
          echo "DB_USER=ecommerce_user" >> $GITHUB_ENV
          echo "DB_PASSWORD=ci_password" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "REDIS_CACHE_URL=redis://127.0.0.1:6379/1" >> $GITHUB_ENV
          echo "CELERY_BROKER_URL=redis://127.0.0.1:6379/0" >> $GITHUB_ENV
          echo "CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/0" >> $GITHUB_ENV
          echo "STRIPE_SECRET_KEY=" >> $GITHUB_ENV
          echo "STRIPE_WEBHOOK_SECRET=" >> $GITHUB_ENV

      - name: Django system check
        run: python manage.py check

      - name: Check database migrations
        run: python manage.py makemigrations --check --dry-run